# Nginx site for the PoolX app on the Hostinger VPS (OD-06, TD-73).
# Install: copy to /etc/nginx/sites-available/poolx, replace every __DOMAIN__ with the real domain (OD-01, pending),
# get a certificate with certbot (see DEPLOYMENT_GUIDE.md), symlink into sites-enabled, `nginx -t`, reload.
#
# The Next.js server listens on 127.0.0.1:3000 only; Nginx is the only public entry point.

upstream poolx_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# Coarse per-IP flood guard in front of the app's own per-action rate limits (core.rate_limit_hit).
limit_req_zone $binary_remote_addr zone=poolx_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=poolx_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://__DOMAIN__$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.__DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;

    return 301 https://__DOMAIN__$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:poolx_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;

    # Slow-client and payload limits (Next 16 self-hosting guide: let the proxy absorb these).
    # Server Actions accept up to 1 MB and payment webhooks 64 KB, so 2 MB is enough headroom.
    client_max_body_size 2m;
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn poolx_conn 50;

    # Security headers (CSP, HSTS, X-Frame-Options, ...) are set by the app in next.config.ts; do not duplicate here.

    # Scheduled jobs are called on 127.0.0.1:3000 by the VPS cron (deploy/cron/poolx-cron.sh), never from the internet.
    location ^~ /api/cron/ {
        return 404;
    }

    # Staff photo uploads (TD-74): the only route that accepts large bodies. The app re-checks the 10 MB cap.
    location = /api/media {
        client_max_body_size 11m;
        client_body_timeout 60s;
        limit_req zone=poolx_req burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://poolx_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_request_buffering on;
        proxy_read_timeout 60s;
    }

    location / {
        limit_req zone=poolx_req burst=40 nodelay;
        limit_req_status 429;

        proxy_pass http://poolx_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # OVERWRITE (not append) the forwarded-for chain so the app's first hop is the real client address
        # (src/modules/core/server/request.ts). If a CDN/WAF is put in front later, configure real_ip first.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Streaming / Partial Prerendering need unbuffered responses.
        proxy_buffering off;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

<h2>Confirm your new email address</h2>
<p>Confirm that you want to change your account email from {{ .Email }} to {{ .NewEmail }}:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change&next=/account/profile">Confirm email change</a></p>
<p>If you didn't request this change, please secure your account by resetting your password.</p>
